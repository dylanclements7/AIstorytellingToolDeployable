runtime: python
env: flex
entrypoint: gunicorn -b :$PORT myproject.wsgi:application --timeout 300

runtime_config:
  python_version: 3.12
  operating_system: "ubuntu22"

resources:
  cpu: 1
  memory_gb: 2
  disk_size_gb: 10

env_variables:
  GEMINI_API_KEY: "PLACEHOLDER_FOR_GITHUB"
  SECRET_KEY: "PLACEHOLDER_FOR_GITHUB"

manual_scaling:
  instances: 1

# Let Django/WhiteNoise handle the URLs
handlers:
- url: /.*
  script: auto
